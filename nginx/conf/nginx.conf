events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_max_body_size 10M;

    # WebSocket upgrade: echo "upgrade" back on Upgrade requests, "close"
    # otherwise. Used by the /socket.io/ proxy below (ludo-engine Socket.IO).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ═══════════════════════════════════════════════════════════
    # MAIN HTTPS SERVER — serves React SPA + proxies API/WebSocket
    # ═══════════════════════════════════════════════════════════
    server {
        # Listen ONLY on port 443 with strict SSL/TLS parameters
        listen 443 ssl;
        listen [::]:443 ssl;

        # ═══════════════════════════════════════════════════════
        # MODIFY: Change this to your actual domain name
        # ═══════════════════════════════════════════════════════
        server_name transcendence-ludo;

        # TLS Protocols mandate (strictly no SSLv3, TLSv1.0, or TLSv1.1)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /etc/nginx/ssl/transcendence.crt;
        ssl_certificate_key /etc/nginx/ssl/transcendence.key;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:;" always;

        # Root directory of the React SPA static files
        root /usr/share/nginx/html;
        index index.html;

        # ═══════════════════════════════════════════════════════
        # SPA ROUTING — all non-file requests serve index.html
        # so React Router handles the frontend navigation
        # ═══════════════════════════════════════════════════════
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ═══════════════════════════════════════════════════════
        # API PROXY — forwards /api/* requests to backend
        # ═══════════════════════════════════════════════════════
        location /api/ {
            proxy_pass http://backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Build health check — returns backend status through nginx
        location = /api/health {
            proxy_pass http://backend:3000/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ═══════════════════════════════════════════════════════
        # ENGINE WEBSOCKET PROXY — forwards Socket.IO traffic to the
        # ludo-engine over the same secure origin (wss://<host>/socket.io/).
        # Gives the browser a same-origin, TLS path to the engine so it
        # never has to reach ludo-engine:3001 directly (blocked as mixed
        # content, and unresolvable from the host anyway).
        # ═══════════════════════════════════════════════════════
        location /socket.io/ {
            proxy_pass http://ludo-engine:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Long-lived sockets: don't cut idle gameplay connections at 60s.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Deny access to hidden files (e.g. .htaccess, .git, .env)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
