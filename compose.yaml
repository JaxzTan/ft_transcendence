networks:
  transcendence_network:
    name: transcendence_network
    driver: bridge

services:
  db:
    build:
      context: ./backend/app/postgres_16_db
      dockerfile: Dockerfile
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-db_bossman}
      POSTGRES_DB: ${POSTGRES_DB:-transcendence}
    volumes:
      - secrets_data:/secrets:ro
      - db_data:/var/lib/postgresql/data
    ports:
      # Loopback-only: in LAN mode a bare "5432:5432" would expose Postgres
      # to every device on the WiFi. Still reachable from the host for psql.
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-db_bossman} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - transcendence_network

  redis:
    build:
      context: ./backend/app/redis
      dockerfile: Dockerfile
    container_name: redis
    restart: unless-stopped
    networks:
      - transcendence_network
    volumes:
      - secrets_data:/secrets:ro
      - redis_data:/data
    expose:
      - "6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SECRETS_DIR: /secrets
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Set by `make tunnel` only — switches AuthModule/AuthController onto the
      # ngrok OAuth apps and frontend origin instead of the localhost ones.
      TUNNEL_MODE: ${TUNNEL_MODE:-false}
    volumes:
      - secrets_data:/secrets:ro
    ports:
      # Loopback-only: clients always reach the backend through nginx's
      # /api/ proxy, never directly. Published purely for host-side debugging.
      - 3000:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - transcendence_network
    # `make dev` runs `compose watch`: no bind mount here, so on a source
    # change compose rebuilds the image and recreates the container instead
    # of syncing files into a running one.
    develop:
      watch:
        - action: rebuild
          path: ./backend
          ignore:
            - node_modules
            - dist
            - generated

  ludo-engine:
    build:
      context: ./backend/app/ludo-engine
      dockerfile: Dockerfile
    container_name: ludo-engine
    restart: unless-stopped
    networks:
      - transcendence_network
    volumes:
      - secrets_data:/secrets:ro
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "3001"
    environment:
      SECRETS_DIR: /secrets
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENGINE_PORT: 3001
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })\""]
      interval: 10s
      timeout: 5s
      retries: 3
    # See backend's `develop.watch` comment above — same reasoning applies here.
    develop:
      watch:
        - action: rebuild
          path: ./backend/app/ludo-engine
          ignore:
            - node_modules
            - dist


  # Long-running publisher: builds the SPA into spa_dist, then watches
  # ./src and republishes on every change instead of exiting.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    volumes:
      - spa_dist:/export
      - ./frontend:/app
      # Anonymous volume: keeps the image's node_modules from being shadowed
      # by the bind mount above, which has none on the host.
      - /app/node_modules
    networks:
      - transcendence_network
    healthcheck:
      test: ["CMD", "test", "-f", "/export/index.html"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Optional HMR dev server, started only by `make dev` (profile: dev). Serves
  # source straight from the bind mount on 8080; the built-and-served-by-nginx
  # path on 8443 keeps running alongside it, untouched.
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend-dev
    profiles:
      - dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
      # Anonymous volume: keeps the image's node_modules from being shadowed by
      # the bind mount above, which has none on the host.
      - /app/node_modules
    environment:
      VITE_IN_CONTAINER: "true"
      VITE_API_TARGET: http://backend:3000
      VITE_ENGINE_TARGET: http://ludo-engine:3001
    depends_on:
      backend:
        condition: service_started
      ludo-engine:
        condition: service_started
    networks:
      - transcendence_network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8443:443"
    volumes:
      - spa_dist:/usr/share/nginx/html:ro
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf/app.inc:/etc/nginx/app.inc:ro
    depends_on:
      # Waiting on the healthcheck (first publish) is what keeps nginx from
      # booting onto an empty document root the first time the stack comes up.
      frontend:
        condition: service_healthy
      backend:
        condition: service_started
      ludo-engine:
        condition: service_started
    networks:
      - transcendence_network

volumes:
  db_data:
  redis_data:
  spa_dist:
  # Not a bind mount — Docker Desktop's macOS virtiofs share deadlocks
  # (EDEADLK) on reads through a live bind mount of ./secrets, sporadically
  # and non-transiently (observed stuck >30s on retry). `docker cp` bypasses
  # that path entirely, so `make seed-secrets` seeds this real Docker volume
  # from the host once per run instead. `external: true` because Make (not
  # compose) owns its lifecycle — compose must never try to create it itself
  # with an empty/no-op volume.
  secrets_data:
    external: true